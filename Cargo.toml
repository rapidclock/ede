[package]
name = "ede"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "A terminal text editor for macOS and Linux"
license = "GPL-3.0-only"
repository = "https://github.com/rapidclock/ede"
readme = "README.md"
keywords = ["editor", "terminal", "text-editor", "tui"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
exclude = ["/.github/", "/.gitignore", "/AGENTS.md", "/REVIEW.md"]

[dependencies]
base64 = "0.22.1"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
memchr = "2.8.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
regex-syntax = "0.8.11"
nix = { version = "0.31.3", default-features = false, features = ["term", "process", "fs", "poll", "resource", "user"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rlsf = { version = "=0.2.3", default-features = false }
signal-hook = { version = "0.4.5", default-features = false }
tempfile = "3.27.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
unicase = "=2.9.0"
toml = "1.1.2"
tree-sitter = "=0.27.2"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-ini = "=1.4.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.4"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", default-features = false }
x11rb-protocol = { version = "0.14.0", default-features = false, features = ["std"] }

[dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "fs"] }
vt100 = "0.18.1"

[lints.rust]
missing_docs = "warn"

[[bin]]
name = "ede"
path = "src/bin/ede.rs"

[[bench]]
name = "storage_bench"
harness = false

# Keep nested grammar and query work within the same deadline in local debug builds.
[profile.dev.package.tree-sitter]
opt-level = 2

[profile.dev.package.regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.rlsf]
opt-level = 2

[profile.release]
opt-level = 3          # Maximum runtime speed (use "z" or "s" to prioritize binary size)
lto = true             # Fat link-time optimization across all crates (use "thin" for faster builds)
codegen-units = 1      # Optimize the entire crate as one unit (slower compile, smaller/faster binary)
strip = true           # Strip both debug info and symbol tables (alias for "symbols")
