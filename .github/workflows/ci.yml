name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build storage benchmark (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked --example storage_bench

      - name: Validate large-file storage with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          for corpus in ordinary dense long; do
            sudo systemd-run --quiet --wait --pipe --collect \
              --property=MemoryMax=8G --property=MemorySwapMax=0 \
              --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
              "$GITHUB_WORKSPACE/target/release/examples/storage_bench" "$corpus" 1024 copy
          done
          sudo systemd-run --quiet --wait --pipe --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
            "$GITHUB_WORKSPACE/target/release/examples/storage_bench" ordinary 1024 copy
