name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Draft PRs only provision a macOS runner.
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft
            && '["macos-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: |
          ulimit -Sn 256
          cargo test --workspace --locked

      - name: Build storage benchmark (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          benchmark=$(cargo bench --locked --bench storage_bench --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.kind == ["bench"] and .target.name == "storage_bench" and .executable != null) | .executable')
          echo "EDE_STORAGE_BENCH=$benchmark" >> "$GITHUB_ENV"

      - name: Build interactive benchmark (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          terminal_test=$(cargo test --release --locked --test terminal --no-run --message-format=json |
            jq -er 'select(.reason == "compiler-artifact" and .target.kind == ["test"] and .target.name == "terminal" and .executable != null) | .executable')
          echo "EDE_TERMINAL_TEST=$terminal_test" >> "$GITHUB_ENV"

      - name: Validate syntax worker release and heap ceiling (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --release --locked --test highlighting
          cargo test --release --locked --test highlighting oversized_projection_reaches_fixed_heap_ceiling -- --ignored --exact --nocapture

      - name: Validate highlighting alongside search with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemd-run --wait --pipe --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 \
            --setenv="TMPDIR=$RUNNER_TEMP" --setenv="EDE_BENCH_PEAK_RSS=1" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
            "$EDE_TERMINAL_TEST" --ignored --exact large_highlighting_and_search_overlap --nocapture

      - name: Build refresh resource probe (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test --release --locked --lib --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test == true) | "EDE_REFRESH_PROBE=\(.executable)"' >> "$GITHUB_ENV"

      - name: Validate scratch recovery and refresh with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemd-run --wait --pipe --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 \
            --setenv="TMPDIR=$RUNNER_TEMP" \
            --setenv="EDE_BENCH_MIB=1024" --setenv="EDE_PASTE_MIB=64" \
            --setenv="EDE_BENCH_PEAK_RSS=1" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
            "$EDE_TERMINAL_TEST" --ignored --exact large_recovery_and_refresh_benchmark --nocapture

      - name: Measure refresh storage under constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemd-run --wait --pipe --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 \
            --setenv="TMPDIR=$RUNNER_TEMP" --setenv="EDE_BENCH_MIB=1024" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
            "$EDE_REFRESH_PROBE" --ignored --exact \
            document::refresh::tests::large_refresh_storage_measurements --nocapture

      - name: Validate search and replacement with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          for corpus in ordinary dense long; do
            sudo systemd-run --wait --pipe --collect \
              --property=MemoryMax=256M --property=MemorySwapMax=0 \
              --setenv="TMPDIR=$RUNNER_TEMP" \
              --setenv="EDE_BENCH_MIB=1024" --setenv="EDE_BENCH_CORPUS=$corpus" \
              --setenv="EDE_BENCH_PEAK_RSS=1" \
              --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
              "$EDE_TERMINAL_TEST" --ignored --exact large_search_and_replace_benchmark --nocapture
          done

      - name: Validate large-file storage with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE
          findmnt -T "$RUNNER_TEMP" -o TARGET,SOURCE,FSTYPE
          lscpu
          free -h
          for corpus in ordinary dense long; do
            sudo systemd-run --wait --pipe --collect \
              --property=MemoryMax=8G --property=MemorySwapMax=0 \
              --setenv="TMPDIR=$RUNNER_TEMP" \
              --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
              "$EDE_STORAGE_BENCH" "$corpus" 1024 copy
          done
          sudo systemd-run --wait --pipe --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 \
            --setenv="TMPDIR=$RUNNER_TEMP" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
            "$EDE_STORAGE_BENCH" ordinary 1024 copy

      - name: Validate large-file editing with constrained memory (Linux)
        if: runner.os == 'Linux'
        run: |
          for corpus in ordinary dense long; do
            sudo systemd-run --wait --pipe --collect \
              --property=MemoryMax=256M --property=MemorySwapMax=0 \
              --setenv="TMPDIR=$RUNNER_TEMP" \
              --setenv="EDE_BENCH_MIB=1024" --setenv="EDE_BENCH_CORPUS=$corpus" \
              --property="WorkingDirectory=$GITHUB_WORKSPACE" --uid="$(id -u)" \
              "$EDE_TERMINAL_TEST" --ignored --exact large_file_interactive_benchmark --nocapture
          done
